name: Asseta
description: Asseta is a San Francisco-based online marketplace for the secondary
  market in semiconductor manufacturing equipment and parts. Founded in 2013, the
  platform lets fabs, refurbishers, and dealers list and discover used, refurbished,
  and new components, ranging from chamber assemblies and power supplies to smaller
  parts like o-rings, with more than 450,000 listings from suppliers around the world.
  Buyers request quotes from global suppliers with a single click and typically save
  50-60% versus OEM pricing. Asseta is a portfolio company of a16z and Y Combinator.
  It publishes no public API, developer portal, SDK, or documentation surface at this
  time; this profile captures the company identity and its published web properties.
